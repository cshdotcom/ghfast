name: real-pull-test

on:
  workflow_dispatch: {}

permissions:
  contents: read

# 真实环境端到端验证(第二轮,v1.0.6):
#  ① 真实 docker daemon 直拉托管站(复现平台 HEAD 拦截限制)
#  ② 托管站边缘证据:同一 URL HEAD vs GET
#  ③ install.sh 自托管 v1.0.6 + 真实 docker pull(GHCR + Hub)
#  ④ crane 纯 GET 拉取:自托管(预期成功)/ 托管站(重部署前预期 realm 失败)
jobs:
  real-pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "① 真实 docker pull 托管站(复现平台限制)"
        continue-on-error: true
        run: |
          docker version --format 'docker client={{.Client.Version}} server={{.Server.Version}}'
          set -o pipefail
          docker pull ghft.space-z.ai/ghcr.io/astral-sh/uv:latest 2>&1 | tee /tmp/pull-hosted.log

      - name: "② 托管站边缘证据:HEAD vs GET"
        run: |
          echo '===== HEAD / ====='
          curl -sSI -m 15 https://ghft.space-z.ai/ || true
          echo '===== HEAD /v2/ghcr.io/astral-sh/uv/manifests/latest ====='
          curl -sSI -m 15 https://ghft.space-z.ai/v2/ghcr.io/astral-sh/uv/manifests/latest || true
          echo '===== GET 同一 URL(应 401 且到达应用) ====='
          curl -sS -D- -o /dev/null -m 15 https://ghft.space-z.ai/v2/ghcr.io/astral-sh/uv/manifests/latest || true

      - name: "③ 自托管 GHFast v1.0.6(install.sh)+ 真实 docker pull"
        run: |
          curl -fsSL https://raw.githubusercontent.com/cshdotcom/ghfast/main/install.sh -o /tmp/install.sh
          bash /tmp/install.sh --port 3000 --dir "$HOME/ghfast" 2>&1 | tail -12
          echo '===== 自托管健康与 realm ====='
          curl -sS -o /dev/null -w 'home: %{http_code}\n' http://127.0.0.1:3000/
          curl -sSI http://127.0.0.1:3000/v2/ | grep -i www-authenticate
          echo '===== 真实 docker pull 走自托管(GHCR) ====='
          docker pull 127.0.0.1:3000/ghcr.io/astral-sh/uv:latest
          echo '===== 真实 docker pull 走自托管(Docker Hub) ====='
          docker pull 127.0.0.1:3000/library/alpine:latest
          echo '===== docker images ====='
          docker images --format '{{.Repository}}:{{.Tag}}  {{.Size}}'

      - name: "④ crane / skopeo 纯 GET 拉取"
        continue-on-error: true
        run: |
          curl -fsSL -o /tmp/crane.tar.gz https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz
          tar -xzf /tmp/crane.tar.gz -C /tmp crane && sudo mv /tmp/crane /usr/local/bin/crane
          echo '===== crane 走自托管(预期成功) ====='
          crane pull --platform=linux/amd64 127.0.0.1:3000/ghcr.io/astral-sh/uv:latest /tmp/uv-local.tar
          docker load -i /tmp/uv-local.tar
          docker run --rm ghcr.io/astral-sh/uv:latest --version
          echo '===== crane 走托管站(站点重部署前预期 http realm 失败) ====='
          crane pull --platform=linux/amd64 ghft.space-z.ai/ghcr.io/astral-sh/uv:latest /tmp/uv-hosted.tar

      - name: "汇总:托管站 docker pull 输出"
        if: always()
        run: |
          echo '----- 步骤①托管站 docker pull 完整输出 -----'
          cat /tmp/pull-hosted.log || true
